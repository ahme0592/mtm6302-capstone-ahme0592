<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NASA APOD Search | Capstone Project</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search NASA Astronomy Picture of the Day by date and save favourites.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>NASA APOD Search</h1>
      <p>Search the Astronomy Picture of the Day by date and save your favourites.</p>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle light or dark mode">
        &#9788; 
</button>

    </div>
  </header>

  <main class="container">
    <!-- Search Form -->
    <section aria-labelledby="search-heading" class="card">
      <h2 id="search-heading">Search by Date</h2>
      <form id="apod-form" novalidate>
        <div class="form-row">
          <label for="date-input">Select a date (not in the future):</label>
          <input
            type="date"
            id="date-input"
            name="date"
            required
            aria-required="true"
          >
        </div>
        <button type="submit" class="btn">Get APOD</button>
        <p id="form-error" class="error-message" aria-live="polite"></p>
      </form>
    </section>

  
    <section aria-labelledby="result-heading" class="card" id="result-section">
      <h2 id="result-heading">Picture of the Day</h2>
      <div id="loading" class="loading" aria-live="polite" hidden>Loading...</div>
      <div id="result-content" class="result-content" aria-live="polite">
        
        <p class="placeholder">Search for a date to see the Astronomy Picture of the Day.</p>
      </div>
    </section>

    
    <section aria-labelledby="favourites-heading" class="card" id="favourites-section">
      <h2 id="favourites-heading">Favourites</h2>
      <div id="favourites-list" class="favourites-list" aria-live="polite">
        <!-- Favourite cards rendered here -->
      </div>
    </section>
  </main>

 
  <div id="hd-modal" class="modal-overlay" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-content">
      <button class="close-modal" aria-label="Close high definition image">&times;</button>
      <img id="hd-image" src="" alt="">
      <p id="hd-caption"></p>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2025 NASA APOD Search. Data courtesy of NASA APOD API.</p>
    </div>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
